<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tsgo Monaco Editor</title>
  <link rel="stylesheet" href="/styles.css">
</head>

<body>
  <header>
    <h1>tsgo TypeScript Playground</h1>
    <div class="toolbar">
      <select class="sample-select" id="sample-select" title="Load a sample">
        <optgroup label="Basic">
          <option value="hello-world" selected>Hello World</option>
          <option value="fibonacci">Fibonacci Sequence</option>
        </optgroup>
        <optgroup label="Intermediate">
          <option value="data-transform">Data Transformation</option>
          <option value="validation">Input Validation</option>
        </optgroup>
        <optgroup label="Advanced">
          <option value="state-machine">State Machine</option>
          <option value="rule-engine">Business Rules Engine</option>
          <option value="json-validator">JSON Schema Validator</option>
          <option value="expression-parser">Expression Parser</option>
          <option value="event-emitter">Event Emitter</option>
          <option value="template-engine">Template Engine</option>
        </optgroup>
        <optgroup label="Bun Only (Async)">
          <option value="async-fetch">Async HTTP Fetch</option>
          <option value="parallel-tasks">Parallel Tasks</option>
          <option value="task-scheduler">Task Scheduler</option>
        </optgroup>
      </select>
      <select class="engine-select" id="engine-select">
        <option value="auto" selected>Auto (Recommended)</option>
        <option value="goja">GOJA (Pure Go)</option>
        <option value="bun">Bun (V8)</option>
      </select>
      <button class="run-btn" id="run-btn" onclick="runCode()">
        ▶ Run <span class="kbd">⌘↵</span>
      </button>
      <div class="status">
        <span class="status-dot" id="ws-status" title="Disconnected"></span>
        <span id="ws-text">Connecting...</span>
      </div>
    </div>
  </header>
  <main>
    <div class="editor-row">
      <div id="editor-container"></div>
      <aside id="types-panel">
        <div class="resize-handle-h" id="types-resize"></div>
        <div class="aside-top">
          <div class="panel-header">Context Types</div>
          <div id="types-preview">// Loading sample...</div>
        </div>
        <div class="aside-bottom" id="contract-panel">
          <div class="resize-handle-v" id="contract-resize"></div>
          <div class="contract-tabs">
            <button class="contract-tab active" data-tab="typescript">TypeScript</button>
            <button class="contract-tab" data-tab="jsonschema">JSON Schema</button>
          </div>
          <div id="contract-content" class="typescript">// Edit code to generate contract...</div>
          <div class="contract-status" id="contract-status">Ready</div>
        </div>
      </aside>
    </div>
    <div class="output-panel" id="output-panel">
      <div class="resize-handle-v" id="output-resize"></div>
      <div class="output-header">
        <span>Output <span class="output-status" id="output-status"></span></span>
        <span class="output-meta" id="output-meta"></span>
      </div>
      <div id="output">Click "Run" or press ⌘+Enter to execute the script</div>
    </div>
  </main>
  <footer>
    <span>TypeScript • tsgo</span>
    <span id="cursor-pos">Ln 1, Col 1</span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
  <script src="/app.js"></script>
</body>

</html>
