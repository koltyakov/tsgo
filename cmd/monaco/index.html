<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tsgo Monaco Editor</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1e1e1e;
      color: #d4d4d4;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #252526;
      padding: 10px 20px;
      border-bottom: 1px solid #3c3c3c;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 16px;
      font-weight: 500;
      color: #cccccc;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .engine-select {
      background: #3c3c3c;
      color: #cccccc;
      border: 1px solid #555;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
    }

    .run-btn {
      background: #0e639c;
      color: white;
      border: none;
      padding: 6px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .run-btn:hover {
      background: #1177bb;
    }

    .run-btn:disabled {
      background: #555;
      cursor: not-allowed;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f44747;
    }

    .status-dot.connected {
      background: #89d185;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .editor-row {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    #editor-container {
      flex: 1;
      min-width: 0;
    }

    aside {
      width: 320px;
      min-width: 200px;
      max-width: 600px;
      background: #252526;
      border-left: 1px solid #3c3c3c;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .aside-top {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100px;
      overflow: hidden;
    }

    .aside-bottom {
      height: 250px;
      min-height: 100px;
      max-height: 500px;
      display: flex;
      flex-direction: column;
      border-top: 1px solid #3c3c3c;
      position: relative;
    }

    .resize-handle-h {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      cursor: ew-resize;
      background: transparent;
      z-index: 10;
    }

    .resize-handle-h:hover,
    .resize-handle-h.dragging {
      background: #007acc;
    }

    .resize-handle-v {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 4px;
      cursor: ns-resize;
      background: transparent;
      z-index: 10;
    }

    .resize-handle-v:hover,
    .resize-handle-v.dragging {
      background: #007acc;
    }

    .panel-header {
      padding: 10px 15px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #bbbbbb;
      background: #2d2d2d;
      border-bottom: 1px solid #3c3c3c;
    }

    #types-preview {
      flex: 1;
      padding: 15px;
      font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
      font-size: 11px;
      line-height: 1.5;
      overflow: auto;
      white-space: pre-wrap;
      color: #9cdcfe;
    }

    .contract-tabs {
      display: flex;
      background: #2d2d2d;
      border-bottom: 1px solid #3c3c3c;
    }

    .contract-tab {
      padding: 8px 12px;
      font-size: 11px;
      color: #888;
      cursor: pointer;
      border: none;
      background: transparent;
      border-bottom: 2px solid transparent;
      transition: all 0.15s;
    }

    .contract-tab:hover {
      color: #ccc;
    }

    .contract-tab.active {
      color: #fff;
      border-bottom-color: #007acc;
    }

    #contract-content {
      flex: 1;
      padding: 12px;
      font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
      font-size: 10px;
      line-height: 1.4;
      overflow: auto;
      white-space: pre-wrap;
      color: #9cdcfe;
    }

    #contract-content.typescript {
      color: #9cdcfe;
    }

    #contract-content.json {
      color: #ce9178;
    }

    .contract-status {
      padding: 4px 12px;
      font-size: 10px;
      color: #666;
      background: #1e1e1e;
      border-top: 1px solid #3c3c3c;
    }

    .output-panel {
      background: #1e1e1e;
      border-top: 1px solid #3c3c3c;
      height: 180px;
      min-height: 80px;
      max-height: 500px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .output-header {
      padding: 8px 15px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #bbbbbb;
      background: #252526;
      border-bottom: 1px solid #3c3c3c;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .output-meta {
      font-size: 11px;
      color: #888;
      text-transform: none;
      letter-spacing: normal;
    }

    #output {
      flex: 1;
      padding: 12px 15px;
      font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
      font-size: 12px;
      line-height: 1.5;
      overflow: auto;
      white-space: pre-wrap;
    }

    #output.error {
      color: #f48771;
    }

    #output.success {
      color: #89d185;
    }

    footer {
      background: #007acc;
      padding: 4px 15px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
    }

    .kbd {
      background: rgba(255,255,255,0.1);
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 11px;
    }
  </style>
</head>

<body>
  <header>
    <h1>tsgo TypeScript Playground</h1>
    <div class="toolbar">
      <select class="engine-select" id="engine-select">
        <option value="goja">GOJA (Pure Go)</option>
        <option value="bun">Bun (V8)</option>
      </select>
      <button class="run-btn" id="run-btn" onclick="runCode()">
        ▶ Run <span class="kbd">⌘↵</span>
      </button>
      <div class="status">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">Disconnected</span>
      </div>
    </div>
  </header>
  <main>
    <div class="editor-row">
      <div id="editor-container"></div>
      <aside id="types-panel">
        <div class="resize-handle-h" id="types-resize"></div>
        <div class="aside-top">
          <div class="panel-header">Type Definitions</div>
          <div id="types-preview">Loading types...</div>
        </div>
        <div class="aside-bottom" id="contract-panel">
          <div class="resize-handle-v" id="contract-resize"></div>
          <div class="contract-tabs">
            <button class="contract-tab active" data-tab="typescript">TypeScript</button>
            <button class="contract-tab" data-tab="jsonschema">JSON Schema</button>
          </div>
          <div id="contract-content" class="typescript">// Edit code to generate contract...</div>
          <div class="contract-status" id="contract-status">Ready</div>
        </div>
      </aside>
    </div>
    <div class="output-panel" id="output-panel">
      <div class="resize-handle-v" id="output-resize"></div>
      <div class="output-header">
        <span>Output</span>
        <span class="output-meta" id="output-meta"></span>
      </div>
      <div id="output">Click "Run" or press ⌘+Enter to execute the script</div>
    </div>
  </main>
  <footer>
    <span>TypeScript • tsgo</span>
    <span id="cursor-pos">Ln 1, Col 1</span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
  <script>
    const defaultCode = `// tsgo TypeScript Playground
// Press ⌘+Enter to run, or click the Run button

// Access injected global variables with full type support
const user: User = currentUser;
const greeting = \`Hello, \${user.name}!\`;

// Use the config object (console.log works in both GOJA and Bun)
if (config.debug) {
  console.log("Debug mode enabled");
  console.log(\`API URL: \${config.apiUrl}\`);
}

// Create a new user object
const newUser: User = {
  id: 2,
  name: "Alice",
  email: "alice@example.com",
  role: "user"
};

// Do some computation
function fibonacci(n: number): number {
  if (n <= 1) return n;
  return fibonacci(n - 1) + fibonacci(n - 2);
}

const fib10 = fibonacci(10);

// Return a result (last expression or export default)
export default {
  greeting,
  newUser,
  fib10,
  userRole: user.role
};
`;

    let ws = null;
    let monaco = null;
    let editor = null;
    let extraLib = null;

    function updateStatus(connected) {
      const dot = document.getElementById('status-dot');
      const text = document.getElementById('status-text');
      if (connected) {
        dot.classList.add('connected');
        text.textContent = 'Connected';
      } else {
        dot.classList.remove('connected');
        text.textContent = 'Disconnected';
      }
    }

    function connectWebSocket() {
      ws = new WebSocket('ws://localhost:8080/monaco/ws');

      ws.onopen = () => updateStatus(true);
      ws.onclose = () => {
        updateStatus(false);
        setTimeout(connectWebSocket, 2000);
      };

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.type === 'types' && monaco) {
          // Update Monaco types
          if (extraLib) extraLib.dispose();
          extraLib = monaco.languages.typescript.typescriptDefaults.addExtraLib(
            data.types,
            'file:///node_modules/@types/tsgo/index.d.ts'
          );
          // Update preview
          document.getElementById('types-preview').textContent = data.types;
        }
      };
    }

    async function runCode() {
      const btn = document.getElementById('run-btn');
      const output = document.getElementById('output');
      const meta = document.getElementById('output-meta');
      const engine = document.getElementById('engine-select').value;

      btn.disabled = true;
      btn.textContent = '⏳ Running...';
      output.className = '';
      output.textContent = 'Executing...';
      meta.textContent = '';

      try {
        const code = editor.getValue();
        const response = await fetch('/execute', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code, engine })
        });

        const result = await response.json();

        if (result.error) {
          output.className = 'error';
          output.textContent = '❌ Error:\n' + result.error;
        } else {
          output.className = 'success';
          let valueStr;
          if (typeof result.value === 'object') {
            valueStr = JSON.stringify(result.value, null, 2);
          } else {
            valueStr = String(result.value);
          }
          output.textContent = '✅ Result:\n' + valueStr;
          meta.textContent = `${result.engine} • ${result.duration} • ${result.type}`;
        }
      } catch (err) {
        output.className = 'error';
        output.textContent = '❌ Network Error:\n' + err.message;
      } finally {
        btn.disabled = false;
        btn.innerHTML = '▶ Run <span class="kbd">⌘↵</span>';
      }
    }

    require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' } });

    require(['vs/editor/editor.main'], function (_monaco) {
      monaco = _monaco;

      // Configure TypeScript
      monaco.languages.typescript.typescriptDefaults.setCompilerOptions({
        target: monaco.languages.typescript.ScriptTarget.ESNext,
        module: monaco.languages.typescript.ModuleKind.ESNext,
        moduleResolution: monaco.languages.typescript.ModuleResolutionKind.NodeJs,
        allowNonTsExtensions: true,
        strict: true,
        noEmit: true,
      });

      // Disable default lib to avoid conflicts
      monaco.languages.typescript.typescriptDefaults.setDiagnosticsOptions({
        noSemanticValidation: false,
        noSyntaxValidation: false,
      });

      // Create editor
      editor = monaco.editor.create(document.getElementById('editor-container'), {
        value: defaultCode,
        language: 'typescript',
        theme: 'vs-dark',
        fontSize: 14,
        lineNumbers: 'on',
        minimap: { enabled: false },
        automaticLayout: true,
        padding: { top: 15 },
        scrollBeyondLastLine: false,
        tabSize: 2,
      });

      // Update cursor position in footer
      editor.onDidChangeCursorPosition((e) => {
        document.getElementById('cursor-pos').textContent = 
          `Ln ${e.position.lineNumber}, Col ${e.position.column}`;
      });

      // Cmd+Enter to run
      editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter, runCode);

      // Connect to WebSocket for live type updates
      connectWebSocket();
    });

    // Resizable panels
    (function() {
      // Horizontal resize for types panel
      const typesPanel = document.getElementById('types-panel');
      const typesResize = document.getElementById('types-resize');
      let isResizingH = false;

      typesResize.addEventListener('mousedown', (e) => {
        isResizingH = true;
        typesResize.classList.add('dragging');
        document.body.style.cursor = 'ew-resize';
        document.body.style.userSelect = 'none';
        e.preventDefault();
      });

      // Vertical resize for output panel
      const outputPanel = document.getElementById('output-panel');
      const outputResize = document.getElementById('output-resize');
      let isResizingV = false;

      outputResize.addEventListener('mousedown', (e) => {
        isResizingV = true;
        outputResize.classList.add('dragging');
        document.body.style.cursor = 'ns-resize';
        document.body.style.userSelect = 'none';
        e.preventDefault();
      });

      document.addEventListener('mousemove', (e) => {
        if (isResizingH) {
          const containerRight = document.body.clientWidth;
          const newWidth = containerRight - e.clientX;
          if (newWidth >= 200 && newWidth <= 600) {
            typesPanel.style.width = newWidth + 'px';
          }
        }
        if (isResizingV) {
          const containerBottom = document.querySelector('main').getBoundingClientRect().bottom;
          const newHeight = containerBottom - e.clientY;
          if (newHeight >= 80 && newHeight <= 500) {
            outputPanel.style.height = newHeight + 'px';
          }
        }
      });

      document.addEventListener('mouseup', () => {
        if (isResizingH) {
          isResizingH = false;
          typesResize.classList.remove('dragging');
          document.body.style.cursor = '';
          document.body.style.userSelect = '';
        }
        if (isResizingV) {
          isResizingV = false;
          outputResize.classList.remove('dragging');
          document.body.style.cursor = '';
          document.body.style.userSelect = '';
        }
      });

      // Vertical resize for contract panel
      const contractPanel = document.getElementById('contract-panel');
      const contractResize = document.getElementById('contract-resize');
      let isResizingContract = false;

      contractResize.addEventListener('mousedown', (e) => {
        isResizingContract = true;
        contractResize.classList.add('dragging');
        document.body.style.cursor = 'ns-resize';
        document.body.style.userSelect = 'none';
        e.preventDefault();
      });

      document.addEventListener('mousemove', (e) => {
        if (isResizingContract) {
          const panelRect = typesPanel.getBoundingClientRect();
          const newHeight = panelRect.bottom - e.clientY;
          if (newHeight >= 100 && newHeight <= 500) {
            contractPanel.style.height = newHeight + 'px';
          }
        }
      });

      document.addEventListener('mouseup', () => {
        if (isResizingContract) {
          isResizingContract = false;
          contractResize.classList.remove('dragging');
          document.body.style.cursor = '';
          document.body.style.userSelect = '';
        }
      });
    })();

    // Contract generation with debounce
    (function() {
      const contractContent = document.getElementById('contract-content');
      const contractStatus = document.getElementById('contract-status');
      const tabs = document.querySelectorAll('.contract-tab');
      
      let currentContract = { typescript: '', jsonSchema: '' };
      let currentTab = 'typescript';
      let debounceTimer = null;

      // Tab switching
      tabs.forEach(tab => {
        tab.addEventListener('click', () => {
          tabs.forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          currentTab = tab.dataset.tab;
          updateContractDisplay();
        });
      });

      function updateContractDisplay() {
        if (currentTab === 'typescript') {
          contractContent.className = 'typescript';
          contractContent.textContent = currentContract.typescript || '// No contract generated';
        } else {
          contractContent.className = 'json';
          contractContent.textContent = currentContract.jsonSchema || '// No schema generated';
        }
      }

      async function generateContract() {
        if (!editor) return;
        
        const code = editor.getValue();
        contractStatus.textContent = 'Generating...';
        
        try {
          const response = await fetch('/contract', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code })
          });
          
          const result = await response.json();
          
          if (result.error) {
            contractStatus.textContent = 'Error: ' + result.error;
            currentContract = { typescript: '// Error generating contract', jsonSchema: '// Error generating schema' };
          } else {
            currentContract = {
              typescript: result.typescript || '// No types exported',
              jsonSchema: result.jsonSchema || '{}'
            };
            const count = result.contract?.types?.length || 0;
            contractStatus.textContent = `Generated ${count} type${count !== 1 ? 's' : ''}`;
          }
          
          updateContractDisplay();
        } catch (err) {
          contractStatus.textContent = 'Network error';
          currentContract = { typescript: '// Network error', jsonSchema: '// Network error' };
          updateContractDisplay();
        }
      }

      function debouncedGenerate() {
        clearTimeout(debounceTimer);
        contractStatus.textContent = 'Waiting...';
        debounceTimer = setTimeout(generateContract, 400);
      }

      // Hook into Monaco editor when ready
      const checkEditor = setInterval(() => {
        if (editor) {
          clearInterval(checkEditor);
          editor.onDidChangeModelContent(debouncedGenerate);
          // Generate initial contract
          generateContract();
        }
      }, 100);
    })();
  </script>
</body>

</html>
